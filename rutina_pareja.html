.note{color:var(--mut);font-size:13.5px;line-height:1.5;margin:10px 4px 0}
.ex{display:grid;grid-template-columns:54px 1fr;gap:12px;margin-top:12px;transition:.3s}
.ex.done{opacity:.55}.ex.done h4{text-decoration:line-through}
.ico{width:54px;height:54px;border-radius:15px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,var(--a),var(--b))}

.grid .card b{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;font-size:22px;color:var(--a);letter-spacing:.04em}
.grid .card p{margin:4px 0 0;font-size:14px;line-height:1.5;color:var(--mut)}
